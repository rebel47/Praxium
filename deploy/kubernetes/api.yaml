apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxium-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: praxium-api
  template:
    metadata:
      labels:
        app: praxium-api
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/example/praxium:0.1.0
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: praxium-secrets
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: praxium-api
spec:
  selector:
    app: praxium-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: praxium-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: praxium-api
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

